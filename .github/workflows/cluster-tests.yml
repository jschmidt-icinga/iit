# Integration tests against an Icinga 2 source tree, only started manually: new tests are usually
# expected to fail until the Icinga 2 changes they cover are merged.
#
#   gh workflow run cluster-tests.yml -f ref=refs/pull/1234/head
#   gh workflow run cluster-tests.yml --ref my-tests-branch -f repository=someone/icinga2 -f ref=fix-sync
name: Cluster tests
run-name: Cluster tests against ${{ inputs.repository }}@${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Icinga 2 repository
        required: true
        default: Icinga/icinga2
      ref:
        description: Icinga 2 branch, tag or full commit hash (refs/pull/N/head for a pull request)
        required: true
        default: master
      selector:
        description: "ERT selector: a regexp matching test names or a Lisp form like (tag :cluster). Empty runs all tests."
        required: false
        default: ''
      unity-build:
        description: Build Icinga 2 as a unity build (faster without cache, slower with it)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cluster-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the tests
        uses: actions/checkout@v5
        with:
          path: iit

      # iit.el uses ../icinga2 by default.
      - name: Check out Icinga 2
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: icinga2
          persist-credentials: false

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      # When the last container on a network stops, podman sends SIGTERM to the pasta process of the
      # rootless network namespace.  The AppArmor profile of pasta on Ubuntu 26.04 doesn't allow it
      # to receive signals from podman, so podman fails with "rootless netns: kill network process:
      # permission denied".  Add the missing rule unless the profile already has a signal rule.
      - name: Allow podman to stop pasta
        run: |
          profile=/etc/apparmor.d/usr.bin.pasta
          if [ -f "$profile" ] && ! grep -q 'signal' "$profile"; then
            sudo sed -i 's/^}$/  signal (receive) set=(term) peer=podman,\n}/' "$profile"
            grep -q 'peer=podman' "$profile"
            sudo apparmor_parser -r "$profile"
          fi

      # The Containerfile keeps ccache's files in a podman build cache mount, which is a plain
      # directory on the host.  The cache entries can't be overwritten, so each run saves a new one
      # and restores the newest.  ccache keeps its size below 5 GB, and GitHub removes the old
      # entries once they take more than the repository's limit.
      - name: Locate the podman build cache
        run: echo "BUILDAH_CACHE=${TMPDIR:-/var/tmp}/buildah-cache-$(id -u)" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILDAH_CACHE }}
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Show versions
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          emacs --version | head -n 1
          podman version
          {
            echo "### Icinga 2 under test"
            echo
            echo "\`$REPOSITORY\` at \`$(git -C icinga2 rev-parse HEAD)\`"
            echo
            echo "$(git -C icinga2 log -1 --format='%s')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: tests
        working-directory: iit
        env:
          EMACS_TEST_JUNIT_REPORT: '1'
          SELECTOR: ${{ inputs.selector }}
          UNITY_BUILD: ${{ inputs.unity-build && 'ON' || 'OFF' }}
        run: ./iit.el --verbose --build-arg "ICINGA2_UNITY_BUILD=$UNITY_BUILD" ${SELECTOR:+"$SELECTOR"}

      # The CMake build directory is a cache mount as well, but not worth keeping: the checkout
      # gives all sources a new modification time, so make recompiles everything anyway.
      - name: Remove the CMake build directory from the cache
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          if [ ! -d "$BUILDAH_CACHE" ]; then
            echo "::warning::$BUILDAH_CACHE doesn't exist, the build didn't use the expected cache location"
            exit 0
          fi
          find "$BUILDAH_CACHE" -mindepth 2 -maxdepth 2 -name CMakeCache.txt -printf '%h\0' |
            xargs -0 -r rm -rf
          du -sh "$BUILDAH_CACHE"

      - name: Save ccache
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILDAH_CACHE }}
          key: ccache-${{ github.run_id }}

      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: iit/iit.xml
          annotate_only: true
          detailed_summary: true
          include_passed: true
