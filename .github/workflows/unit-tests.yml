# Self-tests of the test infrastructure.  They need neither podman nor Icinga 2.
name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tests
        uses: actions/checkout@v5

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
          emacs --version

      - name: Byte-compile
        run: |
          emacs -Q --batch --eval '(setq byte-compile-error-on-warn t)' \
            -L . -f batch-byte-compile iit-lib.el iit-cluster.el iit.el
          rm -f *.elc

      - name: Run unit tests
        run: ./iit.el '(tag :unit)'
